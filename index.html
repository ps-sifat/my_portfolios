<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    Theme before first paint (prevents a dark/light flash).
    Uses the visitor's saved choice, otherwise the device setting.
    Keep the key in sync with src/context/theme.js.
  -->
  <script>
    (function () {
      var theme;
      try {
        var saved = localStorage.getItem("theme-preference");
        if (saved === "dark" || saved === "light") theme = saved;
      } catch (e) {}
      if (!theme) {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      var root = document.documentElement;
      root.classList.add(theme);
      root.style.colorScheme = theme;
      window.__INITIAL_THEME__ = theme;
    })();
  </script>

  <link rel="icon" type="image/svg+xml" href="/src/assets/logo.svg" />

  <!-- Fonts (non-blocking preconnect instead of a CSS @import) -->

    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" />

  <!-- Theme color for mobile browsers (updated at runtime when the theme changes) -->

  <script>
    document.querySelector('meta[name="theme-color"]').setAttribute(
